[package]
name = "korz"
version = "0.0.1"
description = "KORZ Music — lecteur musical desktop"
authors = ["2dekur"]
edition = "2024"

[lib]
# `_lib` suffix: avoids a name clash between the lib and the bin on Windows (cargo#8519).
name = "korz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# Audio output + decoding (symphonia: MP3, FLAC, WAV, AAC/ADTS, M4A/ALAC, OGG Vorbis).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "flac", "wav", "vorbis", "mp4", "symphonia-alac"] }
# Tags, embedded covers and exact durations for every supported format.
lofty = "0.25"
rusqlite = { version = "0.43", features = ["bundled"] }
# Content hash for cached cover files.
sha2 = "0.10"
# Accent-insensitive search: NFD decomposition, combining marks dropped.
unicode-normalization = "0.1"
# HTTP for Smart Link (oEmbed, direct audio links): same reqwest/rustls build as the updater.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
